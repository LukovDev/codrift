<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Веб-приложение: значок на экране «Домой», полноэкранный режим, цвет строки состояния -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codrift">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>Codrift</title>
<meta name="description" content="3D code structure visualizer (C, C++, Java, C#, JS/TS, Python): #include/import graph, call graph, API, directories and statistics. Runs entirely in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='10' r='5' fill='%233987e5'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23d95926'/%3E%3Ccircle cx='16' cy='23' r='6' fill='%23199e70'/%3E%3Cpath d='M9 10L23 9M9 10L16 23M23 9L16 23' stroke='%23898781' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
:root {
    color-scheme: light;
    --bg: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --graph-bg: #f4f3ef;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --line: #e1e0d9; --line-2: #c3c2b7;
    --ring: rgba(11,11,11,0.10); --accent: #2a78d6; --accent-ink: #ffffff; --hl: #e34948;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --ext: #a9a79f; --warn: #fab219; --crit: #d03b3b;
    --shadow: 0 6px 24px rgba(0,0,0,.12);
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --graph-bg: #101010;
        --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --line: #2c2c2a; --line-2: #383835;
        --ring: rgba(255,255,255,0.10); --accent: #3987e5; --accent-ink: #ffffff; --hl: #e66767;
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
        --ext: #5d5c57; --shadow: 0 6px 24px rgba(0,0,0,.5);
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --graph-bg: #101010;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --line: #2c2c2a; --line-2: #383835;
    --ring: rgba(255,255,255,0.10); --accent: #3987e5; --accent-ink: #ffffff; --hl: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --ext: #5d5c57; --shadow: 0 6px 24px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* Стабильность на телефоне: без масштабирования страницы (двойной тап, щипок), «резинки» и выделения долгим тапом */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; }
#graph, #labels, #gtools, #legend, header { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
/* iOS увеличивает страницу при фокусе на полях со шрифтом меньше 16px */
@media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
[hidden] { display: none !important; }

/* ---------- Каркас ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
    padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; min-width: 0;
}
.brand { font-weight: 650; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.brand small { font-weight: 400; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
    min-width: 36px; height: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.iconbtn:hover { background: var(--surface-2); }
.iconbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.iconbtn svg { width: 18px; height: 18px; flex: none; }
#tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 3px; overflow-x: auto; scrollbar-width: none; flex: none; position: relative; }
#tabs::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: var(--ix, 3px); width: var(--iw, 0px); border-radius: 7px; background: var(--surface); box-shadow: 0 1px 3px var(--ring); pointer-events: none; }
#tabs.ready::before { transition: left .32s cubic-bezier(.2, .8, .2, 1), width .32s cubic-bezier(.2, .8, .2, 1); }
#tabs::-webkit-scrollbar { display: none; }
#tabs button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; white-space: nowrap; color: var(--ink-2); position: relative; z-index: 1; }
#tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; }
#tabs button:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
.searchwrap { position: relative; flex: 0 1 280px; min-width: 120px; }
#search {
    width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 10px 0 32px;
}
.searchwrap > svg { position: absolute; left: 9px; top: 9px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
#results {
    position: absolute; top: 40px; right: 0; left: auto; width: max(100%, 380px); max-height: 70vh; overflow: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 40; padding: 4px;
}
#results button { display: flex; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; gap: 8px; align-items: baseline; }
#results button.act, #results button:hover { background: var(--surface-2); }
#results .r-sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Шапка списка узлов: число и сортировка (прилипает при прокрутке) */
#results .rhead { position: sticky; top: -4px; z-index: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -4px -4px 4px; padding: 6px 6px; background: var(--surface); border-bottom: 1px solid var(--line); }
#results .rcount { font-size: 12px; color: var(--muted); white-space: nowrap; }
#results .rsort { margin-left: auto; padding: 2px; }
#results .rsort button { display: block; width: auto; flex: none; padding: 3px 8px; font-size: 12px; border-radius: 6px; }
#results .r-ct { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }

main { position: relative; overflow: hidden; min-height: 0; }
#graph { position: absolute; inset: 0; background: var(--graph-bg); }

#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.nlabel {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    font: var(--label-size, 11px)/1.2 var(--mono); color: var(--ink); background: color-mix(in srgb, var(--surface) 78%, transparent);
    padding: 1px 4px; border-radius: 4px; will-change: transform; backface-visibility: hidden;
}
.nlabel.sel { font-weight: 700; outline: 1.5px solid var(--hl); }
#graph canvas { touch-action: none; display: block; }
.nlabel { transition: opacity .28s ease; }
.nlabel.off { opacity: 0; }
/* Тёмные стили сцены: подписи как голографические метки */
body.scene-dark .nlabel { color: #e4ecff; background: rgba(6, 10, 26, .55); border: 1px solid rgba(120, 165, 255, .22);
    text-shadow: 0 0 6px rgba(110, 170, 255, .85); letter-spacing: .03em; }
body.scene-dark .nlabel.sel { outline: 1.5px solid #ffe066; color: #fff6cf; text-shadow: 0 0 8px rgba(255, 224, 102, .9); }
body.scene-dark #graph { background: #03040a; }
.nlabel.ext { opacity: .7; font-style: italic; }
/* Карточки пресетов стиля */
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-bottom: 8px; }
.preset { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 5px; display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.preset.on { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 1px var(--accent); }
.preset .pv { display: block; height: 34px; border-radius: 7px; }
.pv-simple { background: radial-gradient(circle at 30% 40%, #3987e5 0 5px, transparent 6px), radial-gradient(circle at 70% 60%, #d95926 0 6px, transparent 7px), #1a1a19; }
.pv-atoms { background: radial-gradient(circle at 32% 45%, #9fd0ff 0 2px, #5aa9ff 5px, transparent 9px), radial-gradient(circle at 70% 55%, #ffd0bb 0 2px, #ff8a5c 6px, transparent 10px), linear-gradient(#141c33, #0a0e19); }
.pv-cosmos { background: radial-gradient(circle at 45% 50%, #fff 0 2px, #4da3ff 4px, transparent 8px), radial-gradient(ellipse at 45% 50%, transparent 9px, #4da3ff55 10px, transparent 11px), radial-gradient(circle at 75% 30%, #5b3fd155, transparent 18px), #03040a; }
.pv-neon { background: radial-gradient(circle at 35% 50%, transparent 4px, #00e5ff 5px, transparent 7px), radial-gradient(circle at 68% 45%, transparent 5px, #ff2bd6 6px, transparent 8px), #050008; }
.pv-blueprint { background: radial-gradient(circle at 45% 50%, transparent 5px, #e8f4ff 6px, transparent 7px), repeating-linear-gradient(0deg, #ffffff18 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, #ffffff18 0 1px, transparent 1px 8px), #0f2d4d; }
.otabs button { padding: 5px 2px; font-size: 12.5px; }
.badge.ptr { background: color-mix(in srgb, var(--s5) 22%, transparent); color: var(--ink); font-family: var(--mono); flex: none; margin: 0; }
#legend i.lk { width: 14px; height: 3px; border-radius: 2px; }
/* Режим встраивания (iframe на сайте проекта) */
body.embed #btnSource, body.embed #btnLang, body.embed .brand small { display: none; }
body.embed header { padding-top: 6px; }
.embed-open { text-decoration: none; font-size: 18px; }
/* Панели не наслаиваются: инструменты и настройки уезжают левее панели деталей; на телефоне настройки прячут нижнюю панель */
@media (min-width: 761px) {
    body.has-details #gtools { right: 392px; }
    body.has-details .popover { right: 440px; }
    #gtools, .popover { transition: right .28s cubic-bezier(.2, .8, .2, 1); }
}
@media (max-width: 760px) { body.opts-open #details { display: none; } }
#lfInput { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 7px 9px; min-height: 34px; font-family: var(--mono); font-size: 12.5px; }
.chips.mods .chipchk { font-size: 12px; }
#gtools .iconbtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
/* Текст кнопок, вкладок, легенды, подписей и кликабельных строк не выделяется при щелчках */
button, .seg, #tabs, #legend, .nlabel, .chip, .preset, .check, .hint, .gtip, table.t th, table.t tr.clk, .card .k, .phead h3, .dsec h5, .brand { -webkit-user-select: none; user-select: none; }
.xbtns { display: flex; flex-wrap: wrap; gap: 6px; }
/* Подсказки к настройкам */
.hint { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%; flex: none;
    font: 600 10.5px/1 system-ui, sans-serif; color: var(--muted); border: 1px solid var(--line-2); cursor: help; vertical-align: 1px; user-select: none; }
.hint:hover, .hint:focus { color: var(--accent); border-color: var(--accent); outline: none; }
.popover .lbl { display: inline-flex; align-items: center; }
.popover .check .grow { flex: 1; }
.gtip.otip { font: 12.5px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 300px; z-index: 80; }
@media (pointer: coarse) { .hint { width: 22px; height: 22px; font-size: 13px; } }
.xbtns .iconbtn { height: 32px; font-size: 12.5px; }
body.dragging main::after { content: ""; position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent) 10%, transparent); z-index: 70; pointer-events: none; }

/* Плавающие элементы управления графом */
#gtools { position: absolute; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
#gtools .iconbtn { box-shadow: var(--shadow); width: 40px; height: 40px; padding: 0; }
#legend {
    position: absolute; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 90px);
    box-shadow: var(--shadow);
}
#legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
#legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
#gcount { color: var(--muted); }

/* Панель настроек: фиксированная высота — вкладки сверху и кнопки сброса снизу не «прыгают» от содержимого */
.popover {
    position: absolute; right: 60px; bottom: 12px; z-index: 30; width: 320px; max-width: calc(100vw - 80px);
    height: min(620px, calc(100% - 24px)); display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.popover .ohead { flex: none; padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
.popover .obody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 12px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; overscroll-behavior: contain; }
.popover .obody::-webkit-scrollbar { width: 8px; }
.popover .obody::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; border: 2px solid var(--surface); }
.popover .obody::-webkit-scrollbar-track { background: transparent; }
.popover .ofoot { flex: none; display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.popover .ofoot .iconbtn { flex: 1; height: 32px; font-size: 12.5px; }
.popover .seg { flex-wrap: wrap; }
.popover .seg button { flex: 1 1 auto; min-width: 0; white-space: nowrap; }
.popover .otabs { margin: 0; flex-wrap: nowrap; }
.popover h4 { margin: 0 0 8px; font-size: 13px; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field > span { font-size: 12px; color: var(--ink-2); }
.field select, .field input[type=text], .field input[type=password], .field input[type=number], .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 7px 9px; min-height: 36px;
}
.field textarea { font-family: var(--mono); font-size: 12px; min-height: 120px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; padding: 4px 0; cursor: pointer; }
.check input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
.seg { display: flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 5px 6px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px var(--ring); }
.slider { margin-bottom: 6px; }
.slider > span { display: flex; justify-content: space-between; }
.slider b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.slider input[type=range] { width: 100%; accent-color: var(--accent); height: 22px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.chipchk { font-size: 13px; }
.chipchk .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.popover .field > .iconbtn { margin-bottom: 4px; }
.popover .field { gap: 6px; }

/* Окно Markdown */
#mdmodal { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
#mdmodal .mdcard { width: min(960px, 100%); height: min(86vh, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
#mdmodal textarea { flex: 1; min-height: 0; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg); padding: 12px; font: 12px/1.5 var(--mono); resize: none; outline: none; }

/* Описание из комментариев */
.doc { background: var(--bg); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; font-size: 13px; color: var(--ink-2); word-break: break-word; }
.doc code { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.doc .dtag { font: 600 11px var(--mono); color: var(--s7); }

/* ---------- Панель источника (слева) ---------- */
#srcpanel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 400px; max-width: 100%; z-index: 25; background: var(--surface);
    border-right: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.phead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.phead h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbody { padding: 12px; overflow: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.btn-wide { width: 100%; height: 40px; }
details.box { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 10px 0; }
details.box > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
#progress { margin-top: 10px; font-size: 12px; color: var(--ink-2); }
#progress .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 6px 0; }
#progress .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .15s; }
.err { color: var(--crit); }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip:hover { background: var(--surface-2); }

/* ---------- Панель деталей (справа / снизу) ---------- */
#details {
    position: absolute; right: 0; top: 0; bottom: 0; width: 380px; max-width: 100%; z-index: 15; background: var(--surface);
    border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
}
#details .handle { display: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; margin: 6px 0 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin-right: 4px; }
.badge.warn { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--ink); }
.sig { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; white-space: pre-wrap; word-break: break-word; }
.dsec h5 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); display: flex; gap: 6px; }
.dsec h5 .n { color: var(--muted); font-weight: 400; }
.nlist { list-style: none; margin: 0; padding: 0; }
.nlist li button {
    display: flex; width: 100%; border: 0; background: transparent; text-align: left; padding: 4px 6px; border-radius: 6px; gap: 8px; align-items: baseline; min-height: 30px;
}
.nlist li button:hover { background: var(--surface-2); }
.nlist .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.nlist .nm { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nlist .ct { margin-left: auto; color: var(--muted); font-size: 12px; flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.actions .iconbtn { height: 32px; font-size: 13px; }
pre.code {
    font: 12px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; overflow: auto; max-height: 50vh; margin: 6px 0;
}
pre.code .ln { display: inline-block; width: 4.5ch; text-align: right; color: var(--muted); padding-right: 1ch; margin-right: 1ch; border-right: 1px solid var(--line); user-select: none; }
pre.code .hl-k { color: var(--s7); font-weight: 600; }
pre.code .hl-c { color: var(--muted); font-style: italic; }
pre.code .hl-s { color: var(--s3); }
pre.code .hl-p { color: var(--s2); }
pre.code .hl-n { color: var(--s1); }

/* ---------- Статистика ---------- */
#stats { position: absolute; inset: 0; overflow: auto; padding: 16px; background: var(--bg); -webkit-overflow-scrolling: touch; }
.stwrap { max-width: 1200px; margin: 0 auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.card .v { font-size: 22px; font-weight: 650; }
.card .k { font-size: 12px; color: var(--ink-2); }
.card .s { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
.panel > h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel > h3 .grow { flex: 1; }
.tablewrap { overflow: auto; max-height: 70vh; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.t th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td:first-child { font-family: var(--mono); font-size: 12px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
table.t tr.clk { cursor: pointer; }
table.t tr.clk:hover td { background: var(--surface-2); }
.tw { display: inline-flex; align-items: center; gap: 4px; }
.tw .tg { width: 16px; display: inline-block; text-align: center; color: var(--muted); }
.sbar { display: flex; height: 10px; width: 160px; gap: 2px; }
.sbar > i { display: block; height: 100%; border-radius: 2px; min-width: 0; }
.legend-inline { display: inline-flex; gap: 12px; font-size: 12px; color: var(--ink-2); font-weight: 400; }
.legend-inline i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.grid2 .panel { margin-bottom: 0; }
.stfilter { height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 8px; width: 200px; }

/* ---------- Приветствие ---------- */
#welcome { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 4; overflow: auto; }
#welcome .wcard { max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
#welcome h1 { margin: 0 0 6px; font-size: 22px; }
#welcome p { color: var(--ink-2); margin: 6px 0 14px; }
#welcome .row { flex-wrap: wrap; }

#toast {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 3; color: var(--muted); }
#loading::before { content: ""; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Подсказка при наведении на узел */
.gtip { position: fixed; z-index: 45; pointer-events: none; max-width: 360px; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; font: 12px/1.4 var(--mono); box-shadow: var(--shadow); word-break: break-word; }
/* Подсказка 3d-force-graph */
.scene-tooltip { z-index: 10; max-width: 340px; white-space: normal; font: 12px var(--mono) !important; background: var(--surface) !important; color: var(--ink) !important; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px !important; }


/* ---------- Анимации интерфейса ---------- */
@keyframes inRight { from { transform: translateX(28px); opacity: 0; } }
@keyframes outRight { to { transform: translateX(28px); opacity: 0; } }
@keyframes inLeft { from { transform: translateX(-28px); opacity: 0; } }
@keyframes outLeft { to { transform: translateX(-28px); opacity: 0; } }
@keyframes inUp { from { transform: translateY(40px); opacity: 0; } }
@keyframes outDown { to { transform: translateY(40px); opacity: 0; } }
@keyframes popIn { from { transform: scale(.94) translateY(6px); opacity: 0; } }
@keyframes popOut { to { transform: scale(.96) translateY(6px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes fadeUp { from { transform: translateY(8px); opacity: 0; } }
@keyframes toastIn { from { transform: translate(-50%, -12px); opacity: 0; } }
@keyframes toastOut { to { transform: translate(-50%, -12px); opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
    .iconbtn, .chip, .seg button, #tabs button, .nlist li button, .preset, #results button, table.t tr td {
        transition: background-color .16s ease, color .16s ease, box-shadow .2s ease, border-color .16s ease, transform .12s ease;
    }
    .iconbtn:active, .chip:active, .preset:active, #tabs button:active, .seg button:active { transform: scale(.95); }
    @media (hover: hover) { #gtools .iconbtn:hover, .preset:hover { transform: translateY(-1px); } }
    /* Шторка деталей на телефоне: высота меняется плавно, при перетаскивании — следует за пальцем */
    #details { transition: height .3s cubic-bezier(.2, .8, .2, 1); }
    #details.dragging { transition: none; }
    .leaving { animation-duration: .17s !important; animation-timing-function: ease-in !important; animation-fill-mode: forwards !important; pointer-events: none; }
    #details:not([hidden]) { animation: inRight .3s cubic-bezier(.2, .8, .2, 1); }
    #details.leaving { animation-name: outRight; }
    #srcpanel:not([hidden]) { animation: inLeft .3s cubic-bezier(.2, .8, .2, 1); }
    #srcpanel.leaving { animation-name: outLeft; }
    .popover:not([hidden]) { animation: popIn .22s cubic-bezier(.2, .8, .2, 1); transform-origin: 100% 100%; }
    .popover.leaving { animation-name: popOut; }
    #results:not([hidden]) { animation: popIn .16s ease-out; transform-origin: 50% 0; }
    #results.leaving { animation-name: fadeOut; }
    #toast:not([hidden]) { animation: toastIn .25s cubic-bezier(.2, .8, .2, 1); }
    #toast.leaving { animation-name: toastOut; }
    #mdmodal:not([hidden]) { animation: fadeIn .2s ease-out; }
    #mdmodal:not([hidden]) .mdcard { animation: popIn .28s cubic-bezier(.2, .8, .2, 1); }
    #mdmodal.leaving { animation-name: fadeOut; }
    #welcome .wcard { animation: popIn .45s cubic-bezier(.2, .8, .2, 1); }
    #legend:not([hidden]) { animation: fadeUp .45s cubic-bezier(.2, .8, .2, 1); }
    /* Кнопки вида появляются по очереди */
    #gtools:not([hidden]) .iconbtn { animation: popIn .34s cubic-bezier(.2, .8, .2, 1) both; }
    #gtools .iconbtn:nth-child(2) { animation-delay: .04s; } #gtools .iconbtn:nth-child(3) { animation-delay: .08s; }
    #gtools .iconbtn:nth-child(4) { animation-delay: .12s; } #gtools .iconbtn:nth-child(n+5) { animation-delay: .16s; }
    /* Смена вкладки настроек — содержимое мягко въезжает */
    .popover .obody.tabswap > * { animation: fadeUp .24s cubic-bezier(.2, .8, .2, 1) both; }
    .popover .obody.tabswap > *:nth-child(2) { animation-delay: .02s; } .popover .obody.tabswap > *:nth-child(3) { animation-delay: .04s; }
    .popover .obody.tabswap > *:nth-child(n+4) { animation-delay: .06s; }
    /* Список узлов: первые строки появляются каскадом при открытии */
    #results .rlist > button.in { animation: fadeUp .26s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--k) * 14ms); }
    /* Подсказка на графе */
    .gtip:not([hidden]) { animation: fadeIn .14s ease-out; }
    /* Загрузка */
    #loading:not([hidden]) { animation: fadeIn .3s ease-out; }
    .pbody.swap > * { animation: fadeUp .26s cubic-bezier(.2, .8, .2, 1) both; }
    .pbody.swap > *:nth-child(2) { animation-delay: .03s; } .pbody.swap > *:nth-child(3) { animation-delay: .06s; }
    .pbody.swap > *:nth-child(4) { animation-delay: .09s; } .pbody.swap > *:nth-child(n+5) { animation-delay: .12s; }
    #stats:not([hidden]) .card, #stats:not([hidden]) .panel { animation: fadeUp .35s cubic-bezier(.2, .8, .2, 1) both; }
    #stats .card:nth-child(2) { animation-delay: .02s; } #stats .card:nth-child(3) { animation-delay: .04s; } #stats .card:nth-child(4) { animation-delay: .06s; }
    #stats .card:nth-child(5) { animation-delay: .08s; } #stats .card:nth-child(n+6) { animation-delay: .1s; }
    #progress .bar > div { transition: width .25s ease; }
    details.box > summary { transition: color .15s; }
    details.box[open] > :not(summary) { animation: fadeUp .22s ease-out; }
}
@media (prefers-reduced-motion: no-preference) and (max-width: 760px) {
    #details:not([hidden]) { animation-name: inUp; }
    #details.leaving { animation-name: outDown; }
    .popover:not([hidden]) { transform-origin: 50% 100%; }
}
/* ---------- Мобильная раскладка ---------- */
@media (max-width: 760px) {
    /* Сверху — отступ под строку состояния и Dynamic Island (веб-приложение на экране «Домой») */
    header { flex-wrap: wrap; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left)); }
    .brand small { display: none; }
    #tabs { order: 5; width: 100%; }
    #tabs button { flex: 1 1 auto; padding: 6px 5px; font-size: 13px; }
    .searchwrap { flex: 1 1 0; min-width: 0; }
    header .spacer { display: none; }
    #results { position: fixed; left: 10px; right: 10px; top: auto; width: auto; }
    #srcpanel { width: 100%; border-right: 0; }
    #details {
        top: auto; left: 0; width: 100%; height: 46%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
        padding-bottom: env(safe-area-inset-bottom); transition: height .2s;
    }
    #details.expanded { height: 88%; }
    #details .handle { display: block; width: 100%; height: 22px; border: 0; background: transparent; position: relative; flex: none; }
    #details .handle::after { content: ""; position: absolute; left: 50%; top: 8px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: var(--line-2); }
    #details .phead { padding-top: 0; }
    /* Шторку тянут за ручку и заголовок — браузер не должен перехватывать это как прокрутку */
    #details .handle, #details .phead { touch-action: none; }
    #legend { max-width: calc(100% - 76px); font-size: 11px; }
    /* Панель настроек не закрывает колонку кнопок справа (иначе её нечем закрыть на телефоне) */
    .popover { right: calc(60px + env(safe-area-inset-right)); left: calc(8px + env(safe-area-inset-left)); width: auto; max-width: none; bottom: calc(10px + env(safe-area-inset-bottom)); height: min(78%, 600px); }
    #gtools { right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); transition: bottom .25s cubic-bezier(.2, .8, .2, 1); }
    /* Кнопки вида остаются доступны над шторкой деталей; легенда прячется */
    body.has-details #gtools { bottom: calc(46% + 10px); }
    body.has-details.opts-open #gtools { bottom: 10px; } /* шторка скрыта, пока открыты настройки */
    body.has-details:has(#details.expanded) #gtools, body.has-details #legend { display: none; }

    .nlist li button { min-height: 38px; }
    #stats { padding: 10px; }
    .card .v { font-size: 19px; }
    .sbar { width: 90px; }
}
</style>
</head>
<body>
<div id="app">
    <header>
        <button class="iconbtn" id="btnSource" title="Source" aria-label="Source">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
        </button>
        <div class="brand">Codrift <small id="projName"></small></div>
        <nav id="tabs" role="tablist"></nav>
        <div class="spacer"></div>
        <div class="searchwrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search / list nodes">
            <div id="results" hidden></div>
        </div>
        <button class="iconbtn" id="btnLang" title="Language">EN</button>
    </header>
    <main>
        <div id="graph"></div>
        <div id="labels"></div>
        <div id="loading" hidden></div>
        <div id="legend" hidden></div>
        <div id="gtools" hidden>
            <button class="iconbtn" id="btnOpts" title="View settings" aria-label="View settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            </button>
            <button class="iconbtn" id="btnRefresh" title="Refresh project (R)" aria-label="Refresh project">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
            </button>
            <button class="iconbtn" id="btnProj" title="Isometric" aria-label="Isometric">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
            </button>
            <button class="iconbtn" id="btnFit" title="Fit all" aria-label="Fit all">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
            <button class="iconbtn" id="btnPause" title="Pause layout and pulses" aria-label="Pause layout and pulses">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
            </button>
        </div>
        <div class="popover" id="opts" hidden></div>
        <div id="stats" hidden></div>
        <div id="welcome"></div>
        <aside id="details" hidden>
            <button class="handle" id="detHandle" aria-label="Expand"></button>
            <div class="phead">
                <h3 id="detTitle"></h3>
                <button class="iconbtn" id="detClose" aria-label="Close">✕</button>
            </div>
            <div class="pbody" id="detBody"></div>
        </aside>
        <aside id="srcpanel" hidden></aside>
        <div id="toast" hidden></div>
        <div id="mdmodal" hidden></div>
    </main>
</div>
<script src="parser.js?v=78"></script>
<script src="langs.js?v=78"></script>
<!-- three.js и 3d-force-graph как ES-модули с одного CDN: three@0.174.0 — та же копия, что импортирует сам граф,
          поэтому собственные объекты сцены (общий буфер связей) совместимы. app.js — обычный скрипт, чтобы работал и file:// -->
<script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.174.0/+esm';
    import ForceGraph3D from 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.77.0/+esm';
    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/postprocessing/UnrealBloomPass.js/+esm';
    window.THREE = THREE; window.ForceGraph3D = ForceGraph3D; window.UnrealBloomPass = UnrealBloomPass;
    const s = document.createElement('script'); s.src = 'app.js?v=78'; document.body.appendChild(s);
</script>
<script nomodule>document.body.textContent = 'This browser is too old for Codrift.';</script>
<script>
    // Если CDN недоступен — сообщаем, а не показываем пустую страницу
    setTimeout(() => { if (!window.ForceGraph3D) { const t = document.getElementById('toast'); t.textContent = 'CDN (jsdelivr) unavailable: three.js / 3d-force-graph not loaded'; t.hidden = false; } }, 15000);
</script>
